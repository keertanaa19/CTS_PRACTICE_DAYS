<!DOCTYPE html>
<html>
<head>
<style>
.imgStyle{
    border: 3px solid black;
    width: 150px;
    height: 100px;
}
</style>
</head>
<body>
<table border="1">
    <caption>Community Events Gallery</caption>
    <tr>
        <td>
            <img src="event1.jpg" alt="Event1"
            title="Music Event" class="imgStyle">
        </td>
        <td>
            <img src="event2.jpg" alt="Event2"
            title="Food Festival" class="imgStyle">
        </td>
        <td>
            <img src="event3.jpg" alt="Event3"
            title="Sports Event" class="imgStyle">
        </td>
    </tr>
    <tr>
        <td>Music Event</td>
        <td>Food Festival</td>
        <td>Sports Event</td>
    </tr>
</table>
</body>
</html>
