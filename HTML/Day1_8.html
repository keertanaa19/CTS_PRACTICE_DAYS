<!DOCTYPE html>
<html>
<head>
<style>
    form{
        border: 2px solid black;
        padding: 20px;
        width: 350px;
        margin: 20px auto;
        background-color: #ffffff;
    }
</style>

<script>
function savePreference(){
    var event=document.getElementById("event").value;

    localStorage.setItem("preferredEvent",event);
}

function loadPreference(){
    var saved=localStorage.getItem("preferredEvent");

    if(saved){
        document.getElementById("event").value=saved;
    }
}

function clearData(){
    localStorage.clear();
    sessionStorage.clear();

    alert("Preferences Cleared");
}

</script>
</head>

<body onload="loadPreference()">
<form>
<select id="event" onchange="savePreference()">
    <option>Music</option>
    <option>Sports</option>
    <option>Food</option>
</select>

<br><br>    

<button onclick="clearData()">Clear Preferences</button>
</form>
</body>
</html>
